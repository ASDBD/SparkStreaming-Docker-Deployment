# Versione di Spark usata ovunque. Per cambiarla: SPARK_VERSION=x.y.z docker compose up -d --build
x-spark-version: &spark-version ${SPARK_VERSION:-4.3.0}

services:
  spark-master:
    image: apache/spark:${SPARK_VERSION:-4.3.0}
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - '127.0.0.1:8080:8080'   # Web UI del master (la porta 7077 resta interna alla rete Docker)
    networks:
      - spark-network

  spark-worker:
    image: apache/spark:${SPARK_VERSION:-4.3.0}
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    networks:
      - spark-network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
      args:
        SPARK_VERSION: *spark-version
    image: spark-streaming-jupyter:${SPARK_VERSION:-4.3.0}
    container_name: jupyter-notebook
    hostname: jupyter
    depends_on:
      - spark-master
    ports:
      - '127.0.0.1:8888:8888'
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
